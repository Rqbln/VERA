# Example run config for vera-eval (MVP2 dynamic benchmarks).
# Benchmark IDs must match the API registry. Full E2E: examples/mvp2_ollama_e2e.yaml

model_id: ollama/llama3.1:8b-instruct-q8_0

benchmarks:
  - mmlu
  - advbench
  - self_disclosure_probes

complai_requirements:
  - R02
  - R06
  - R08

config:
  temperature: 0.0
  max_tokens: 256
  n_samples_per_benchmark: 4
  seed: 42
  bootstrap_n: 200

governance:
  intended_use: "Local MVP2 evaluation"
  oos_use: "Not for production deployment without review"
