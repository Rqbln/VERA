services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: >
      -c "
      sleep 5 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/vera || true &&
      mc mb -p local/mlflow || true &&
      mc mb -p local/vera-datasets-clean || true &&
      mc mb -p local/vera-datasets-poisoned || true &&
      mc mb -p local/vera-checkpoints || true
      "

  postgres-vera:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vera
      POSTGRES_PASSWORD: vera
      POSTGRES_DB: vera
    ports:
      - "5433:5432"
    volumes:
      - pg_vera:/var/lib/postgresql/data
      - ./infra/sql/vera:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera"]
      interval: 5s
      timeout: 5s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: vera
      POSTGRES_PASSWORD: vera
      POSTGRES_DB: vera_ts
    ports:
      - "5434:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
      - ./infra/sql/timescale:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://mlflow/
      --serve-artifacts
    ports:
      # Host 5001: macOS AirPlay Receiver often binds :5000
      - "5001:5000"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    volumes:
      - ./infra/keycloak/vera-realm.json:/opt/keycloak/data/import/vera-realm.json:ro
    ports:
      - "8080:8080"

  api:
    build: .
    command: uvicorn vera.api.main:app --host 0.0.0.0 --port 8000
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: vera
      KEYCLOAK_CLIENT_ID: vera-dashboard
      VERA_AUTH_MODE: enterprise
      VERA_AUTH_DISABLED: "0"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT: vera-mvp2
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: vera
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
      OLLAMA_API_BASE: http://host.docker.internal:11434
      VERA_TARGET_MODEL: ollama/llama3.1:8b-instruct-q8_0
      VERA_POSTGRES_URL: postgresql://vera:vera@postgres-vera:5432/vera
      VERA_TIMESCALE_URL: postgresql://vera:vera@timescaledb:5432/vera_ts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      mlflow:
        condition: service_started
      minio:
        condition: service_started
      keycloak:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at build time — must be build args, not just runtime env.
        NEXT_PUBLIC_AUTH_MODE: enterprise
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
        NEXT_PUBLIC_KEYCLOAK_REALM: vera
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: vera-dashboard
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: vera
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: vera-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - api
      - keycloak

  worker:
    build: .
    command: celery -A vera.celery_app worker --loglevel=INFO
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT: vera-mvp2
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: vera
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
      OLLAMA_API_BASE: http://host.docker.internal:11434
      VERA_TARGET_MODEL: ollama/llama3.1:8b-instruct-q8_0
      VERA_POSTGRES_URL: postgresql://vera:vera@postgres-vera:5432/vera
      VERA_TIMESCALE_URL: postgresql://vera:vera@timescaledb:5432/vera_ts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      mlflow:
        condition: service_started
      minio:
        condition: service_started

volumes:
  pgdata:
  pg_vera:
  tsdata:
  minio_data:
  mlflow_data:
