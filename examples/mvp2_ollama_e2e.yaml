# MVP2 — dynamic benchmarks via LiteLLM → Ollama (llama3.1:8b-instruct-q8_0).

model_id: ollama/llama3.1:8b-instruct-q8_0

benchmarks:
  - mmlu_robust
  - boolq_contrast
  - advbench
  - tensortrust
  - gsm8k
  - truthfulqa
  - self_disclosure_probes
  - watermark_kirchenbauer
  - bbq
  - decodingtrust_adult
