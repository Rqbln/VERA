requirement_weights:
  R01:
    r01_robustness: 0.6
    mmlu_robust: 0.2
    boolq_contrast: 0.2
  R02:
    advbench: 0.4
    tensortrust: 0.2
    llm_rules: 0.2
    decodingtrust_adv: 0.2
  R12:
    advbench: 0.4
    advbench_instruction: 0.3
    realtoxicityprompts: 0.2
