[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raip"
version = "0.2.0"
description = "RAIP MVP2 — dynamic evaluation core (FastAPI, Celery, LangGraph, LiteLLM/Ollama)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "celery[redis]>=5.4,<6",
    "redis>=5,<6",
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "litellm>=1.50,<2",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "mlflow>=2.16,<3",
    "boto3>=1.34,<2",
    "jinja2>=3.1,<4",
    "pyyaml>=6,<7",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
benchmarks = [
    "lm-eval>=0.4.9,<0.5",
    "garak>=0.10,<0.11",
    "datasets>=2.18,<4",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
markers = [
    "integration: needs live Redis and MinIO (RAIP_INTEGRATION=1)",
    "e2e: end-to-end tests (needs Redis, MinIO, MLflow, Ollama)",
    "ollama: requires a live Ollama/vLLM endpoint",
    "airgap: optional air-gapped or sovereignty checks",
]
testpaths = ["tests/unit", "tests/integration", "tests/e2e", "tests"]

[tool.coverage.run]
source = ["raip"]
branch = true
omit = [
    "*/templates/*",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[project.scripts]
raip-eval = "raip.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/raip"]

[tool.hatch.build.targets.sdist]
include = ["src/raip", "examples", "pyproject.toml", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
