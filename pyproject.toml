[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vera"
version = "0.2.0"
description = "VERA MVP2 — evaluation core + injection lab (FastAPI, Celery, LangGraph, LiteLLM/Ollama)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "celery[redis]>=5.4,<6",
    "redis>=5,<6",
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "litellm>=1.50,<2",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "mlflow>=2.16,<3",
    "boto3>=1.34,<2",
    "jinja2>=3.1,<4",
    "pyyaml>=6,<7",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "PyJWT[crypto]>=2.8,<3",
]

[project.optional-dependencies]
benchmarks = [
    "lm-eval>=0.4.9,<0.5",
    "garak>=0.10,<0.11",
    "datasets>=2.18,<4",
]
lab = [
    "detoxify>=0.5,<0.6",
    "presidio-analyzer>=2.2,<3",
    "python-Levenshtein>=0.25,<0.27",
    "sacrebleu>=2.4,<3",
    "codecarbon>=2.3,<3",
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<2.4",
    "psycopg[binary]>=3.1,<4",
    "scipy>=1.11,<2",
]
pdf = [
    # Signed audit-PDF export. Needs system libs (cairo, pango) — see USER_GUIDE / README.
    "weasyprint>=60,<63",
]
gaas = [
    # Governance-as-a-Service runtime (MVP4). The bus degrades to Redis Streams if confluent-kafka
    # is absent; OpenSearch indexing degrades to a signed JSONL chain if opensearch-py is absent.
    "confluent-kafka>=2.3,<3",
    "opensearch-py>=2.4,<3",
    "uvloop>=0.19,<0.22",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
markers = [
    "integration: needs live Redis and MinIO (VERA_INTEGRATION=1)",
    "e2e: end-to-end tests (needs Redis, MinIO, MLflow, Ollama)",
    "ollama: requires a live Ollama/vLLM endpoint",
    "airgap: optional air-gapped or sovereignty checks",
    "lab: MVP2 lab unit tests (no GPU)",
    "gpu: requires GPU runner",
    "slow: long-running lab experiments",
]
testpaths = ["tests/unit", "tests/integration", "tests/e2e", "tests/lab", "tests"]

[tool.coverage.run]
source = ["vera"]
branch = true
omit = [
    "*/templates/*",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[project.scripts]
vera-eval = "vera.cli.main:main"
vera-lab = "vera.cli.lab_main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vera"]

[tool.hatch.build.targets.sdist]
include = ["src/vera", "examples", "pyproject.toml", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
# One-off reproduction/benchmark scripts: long literals (model-id lists, f-strings, print rows) are
# fine, and they set os.environ defaults before importing vera (config picks them up).
"scripts/**" = ["E402", "E501"]
"manuscript/scripts/**" = ["E402", "E501", "UP031"]
